name: Feature request
description: Suggest an idea for cloudkit
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that cloudkit makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API you would like, and the provider capability it maps to.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
